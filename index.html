<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freezer Navigation</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Freezer Navigation</h1>
    <div class="theme-control" role="group" aria-label="Color theme">
      <button type="button" class="theme-button" data-theme-value="light" aria-label="Switch to Light Mode" title="Switch to Light Mode" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
        </svg>
      </button>
      <button type="button" class="theme-button" data-theme-value="dark" aria-label="Switch to Dark Mode" title="Switch to Dark Mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.9 13.2A9 9 0 0 1 10.8 3.1a9 9 0 1 0 10.1 10.1Z" />
        </svg>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <script type="module" src="./src/index.ts"></script>
</body>
</html>
